[project]
name = "transcribe"
version = "0.1.0"
description = "Local meeting recorder and transcriber with a web UI and an MCP server for Claude Desktop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp",
    "faster-whisper",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 removed.
    "av<19",
    "soundcard",
    "numpy",
    "sherpa-onnx",
    "httpx2>=2.16.0",
    "pillow>=13.0.0",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
]

[project.scripts]
transcribe = "transcribe.cli:main"

# Windowless launcher for the tray app (no console window).
[project.gui-scripts]
transcribe-tray = "transcribe.tray:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
