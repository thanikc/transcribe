name: Windows installer

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]  # 1.2.3 or v1.2.3: builds and attaches to a release; path filters don't apply to tags
    branches: ["**"]  # builds an artifact when the installer or the app changes
    paths:
      - "installer/**"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write  # attach the installer to the release

env:
  UV_VERSION: "0.13.7"  # also bundled in the installer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the installer version comes from the latest tag

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build

      - name: Test
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Fetch uv.exe, Python and draw the icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile build\uv.zip
          Expand-Archive build\uv.zip build\uv -Force
          Copy-Item build\uv\uv.exe build\uv.exe
          # Ship Python as plain files: a uv-managed install adds a junction the installer can't follow (os error 448).
          # The pinned uv resolves "3.12" to the same patch release every time.
          $env:UV_PYTHON_INSTALL_DIR = "$PWD\build\pythons"
          uv python install 3.12 --no-bin --no-registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $real = Get-ChildItem build\pythons -Directory | Where-Object { $_.Name -match '^cpython-3\.12\.\d+-windows-x86_64-none$' }
          if (@($real).Count -ne 1) { throw "expected one CPython 3.12 install, got: $($real.Name)" }
          Copy-Item $real.FullName build\python -Recurse
          if (-not (Test-Path build\python\python.exe)) { throw "no python.exe in $($real.FullName)" }
          uv run python -c "from transcribe.desktop import icon_image; icon_image(False).save('build/transcribe.ico', sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64)])"

      - name: Build the installer
        shell: pwsh
        run: |
          # On a tag: 1.2.3. After it: 1.2.3-4-gabc1234 (4 commits later). No tag yet: 0.0.0-dev.<run>.
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { git describe --tags --match "[0-9]*" --match "v[0-9]*" 2>$null }
          $version = if ($version) { $version -replace '^v', '' } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          $global:LASTEXITCODE = 0
          Write-Host "Installer version: $version"
          # The app reads it as its installed version (transcribe/VERSION) to show it and to look for updates.
          Set-Content build\VERSION $version -NoNewline -Encoding ascii
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $iscc "/DAppVersion=$version" installer\transcribe.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Transcribe-Setup
          path: dist/*.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on the GitHub page already exists by now; one made by pushing a tag does not.
          $installer = (Get-Item dist\*.exe).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME $installer --clobber }
          else { gh release create $env:GITHUB_REF_NAME $installer --generate-notes }
          exit $LASTEXITCODE
