<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings</title>
<style>
:root {
  color-scheme: light dark;

  /* 4px / 8px Swiss Spatial Scale */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Typography Scale & Stacks */
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Leelawadee UI", "Noto Sans Thai", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "Consolas", monospace;
  --text-xs: 0.75rem;     /* 12px — labels, badges, metadata */
  --text-sm: 0.8125rem;   /* 13px — timestamps, speaker tags, controls */
  --text-base: 0.9375rem; /* 15px — UI body */
  --text-read: 1rem;      /* 16px — transcript body text */
  --text-lg: 1.125rem;    /* 18px — meeting title */

  /* Swiss Minimalist Color System — Light (Archival Paper & Ink) */
  --bg: #f7f7f5;
  --panel: #ffffff;
  --surface-subtle: #efefec;
  --text: #111315;
  --text-secondary: #373c44;
  --muted: #636b75;
  --border: #dddeda;
  --border-strong: #111315;
  --accent: #0047ab;
  --accent-text: #ffffff;
  --accent-soft: #edf3fc;
  --danger: #c81e1e;
  --danger-bg: #fdf2f2;
  --ok: #156534;
  --ok-bg: #eef8f1;
  --warn: #8f4f00;
  --warn-bg: #fef7ec;
  --hover: #f0f1ee;

  /* Distinct High-Contrast Speaker Palette (4.5:1+ on light) */
  --sp0: #0047ab;
  --sp1: #b43e12;
  --sp2: #126b40;
  --sp3: #6e2ea1;
  --sp4: #9c1f4b;
  --sp5: #4d5e00;

  --header-h: 52px;
  --radius-sm: 2px;
  --radius-md: 4px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0f12;
    --panel: #14171c;
    --surface-subtle: #1c2027;
    --text: #f1f3f5;
    --text-secondary: #c8cfd8;
    --muted: #8a94a2;
    --border: #262c36;
    --border-strong: #f1f3f5;
    --accent: #5294ff;
    --accent-text: #08101d;
    --accent-soft: #17243a;
    --danger: #ff7b72;
    --danger-bg: #321616;
    --ok: #5cd68d;
    --ok-bg: #12291c;
    --warn: #f2b84b;
    --warn-bg: #2c2110;
    --hover: #1e232b;

    /* Distinct Speaker Palette (4.5:1+ on dark) */
    --sp0: #7cb0ff;
    --sp1: #ff9e6c;
    --sp2: #68d89b;
    --sp3: #d69df5;
    --sp4: #f78bab;
    --sp5: #c9db6b;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* App Shell: Persistent Top Control Dock + Full-Height Reading Grid */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* 1. Persistent Top Recording & Capture Dock */
.top-dock {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-2) var(--sp-4);
}

.dock-inner {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-right: var(--sp-1);
}

h1 {
  font-size: var(--text-base);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  white-space: nowrap;
}

#status {
  margin: 0;
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  padding: 2px var(--sp-2);
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  white-space: nowrap;
}

#status.rec {
  color: var(--danger);
  background: var(--danger-bg);
  border-color: var(--danger);
  font-weight: 600;
}

.rec-controls {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 1 1 320px;
}

.rec-controls .title-input {
  flex: 1 1 180px;
  max-width: 300px;
  height: 32px;
  padding: 0 var(--sp-2);
  font-size: var(--text-sm);
}

/* Inline Level Meters in Dock */
#meters {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  padding: 0 var(--sp-2);
}
#meters[hidden] { display: none; }
.meter-item {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
#meters .bar {
  width: 56px;
  height: 6px;
  border-radius: 1px;
  background: var(--border);
  overflow: hidden;
}
#meters .bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.15s linear;
}
#meters .quiet {
  color: var(--danger);
  font-weight: 600;
}

/* Popover Drawers in Top Dock */
.dock-drawers {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
}

details.popover {
  position: relative;
}

details.popover > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 32px;
  padding: 0 var(--sp-3);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  user-select: none;
  white-space: nowrap;
}

details.popover > summary::-webkit-details-marker { display: none; }
details.popover > summary:hover { background: var(--hover); color: var(--text); }
details.popover[open] > summary {
  border-color: var(--text);
  background: var(--surface-subtle);
  color: var(--text);
}

.popover-body {
  position: absolute;
  right: 0;
  top: calc(100% + var(--sp-1));
  width: 300px;
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  z-index: 50;
}

/* 2. Main Swiss 2-Column Workspace */
main {
  flex: 1;
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  align-items: stretch;
}

@media (max-width: 820px) {
  main {
    grid-template-columns: 1fr;
  }
  .popover-body {
    left: 0;
    right: auto;
    width: min(300px, 92vw);
  }
}

/* Left Rail: Search + Past Meetings + Version Footer */
.sidebar {
  border-right: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - var(--header-h));
}

@media (max-width: 820px) {
  .sidebar {
    border-right: 0;
    border-bottom: 1px solid var(--border);
    min-height: auto;
    max-height: 360px;
  }
}

.sidebar-section {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}

.sidebar-list-section {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-3) var(--sp-4);
}

h2 {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 var(--sp-2);
}

/* Controls & Form Elements */
label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--muted);
  margin: var(--sp-2) 0 var(--sp-1);
}
label:first-child { margin-top: 0; }

input, select, button {
  font: inherit;
  color: inherit;
}

input[type=text], input[type=search], select {
  width: 100%;
  height: 32px;
  padding: 0 var(--sp-2);
  font-size: var(--text-sm);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color 0.15s ease;
}

input[type=text]:focus, input[type=search]:focus, select:focus {
  border-color: var(--accent);
}

input[type=file] {
  width: 100%;
  font-size: var(--text-xs);
}

button {
  cursor: pointer;
  height: 32px;
  padding: 0 var(--sp-3);
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  transition: background-color 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}

button:hover:not(:disabled) {
  background: var(--hover);
  border-color: var(--muted);
}

button.primary {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}
button.primary:hover:not(:disabled) {
  filter: brightness(1.08);
}

button.danger {
  color: var(--danger);
  border-color: var(--border);
}
button.danger:hover:not(:disabled) {
  background: var(--danger-bg);
  border-color: var(--danger);
}

button.stop {
  background: var(--danger);
  color: #ffffff;
  border-color: var(--danger);
  font-weight: 600;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.row {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  align-items: flex-end;
}
.row > div {
  flex: 1 1 130px;
}

.err {
  background: var(--danger-bg);
  color: var(--danger);
  border-left: 3px solid var(--danger);
  padding: var(--sp-2) var(--sp-3);
  margin-top: var(--sp-2);
  font-size: var(--text-xs);
}
.err:empty { display: none; }

.muted { color: var(--muted); }

/* Sidebar Meetings Index & Search Hits */
ul.list {
  list-style: none;
  margin: 0;
  padding: 0;
}

ul.list li + li {
  border-top: 1px solid var(--border);
}

.item {
  display: block;
  width: 100%;
  height: auto;
  text-align: left;
  padding: var(--sp-2) var(--sp-2);
  border-radius: 0;
  border: 0;
  border-left: 2px solid transparent;
  background: transparent;
  white-space: normal;
}

.item:hover {
  background: var(--hover);
}

.item[aria-current=true] {
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

.item .t {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  font-size: var(--text-sm);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.item .m {
  margin-top: 2px;
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.hit {
  margin-top: var(--sp-1);
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
}

#hits:not(:empty) {
  margin-top: var(--sp-2);
  max-height: 240px;
  overflow-y: auto;
}

/* Crisp Swiss Status Badges */
.badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  line-height: 1.4;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid currentColor;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  flex-shrink: 0;
}
.badge.recording { color: var(--danger); background: var(--danger-bg); }
.badge.transcribing { color: var(--warn); background: var(--warn-bg); }
.badge.transcribed { color: var(--ok); background: var(--ok-bg); }
.badge.failed { color: var(--danger); background: var(--danger-bg); }

/* Right Column: Primary Transcript Reading Canvas */
#view-section {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - var(--header-h));
}

#view {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: var(--sp-6) var(--sp-8);
  max-width: 980px;
  width: 100%;
}

@media (max-width: 820px) {
  #view {
    padding: var(--sp-4);
  }
}

.empty-state {
  margin: auto 0;
  padding: var(--sp-8) 0;
  color: var(--muted);
  font-size: var(--text-base);
}

/* Meeting Header & Compact Inline Metadata Strip */
.meeting-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  padding-bottom: var(--sp-3);
  border-bottom: 2px solid var(--border-strong);
}

.meeting-title-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin: 0;
  font-size: var(--text-lg);
  font-weight: 700;
  letter-spacing: -0.015em;
  overflow-wrap: anywhere;
}

.title-edit {
  height: auto;
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  cursor: pointer;
  white-space: normal;
}
.title-edit:hover {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* Secondary Metadata Strip (dl.meta) */
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-4);
  margin: var(--sp-2) 0 0;
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--border);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.meta-pair {
  display: inline-flex;
  align-items: baseline;
  gap: var(--sp-1);
}
.meta dt {
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.meta dt::after { content: ":"; }
.meta dd {
  margin: 0;
  color: var(--text-secondary);
  font-weight: 500;
}

.warn {
  background: var(--warn-bg);
  color: var(--warn);
  border-left: 3px solid var(--warn);
  padding: var(--sp-2) var(--sp-3);
  margin: var(--sp-2) 0 0;
  font-size: var(--text-xs);
}

/* Progress Box */
.progress {
  margin: var(--sp-6) 0;
  padding: var(--sp-4);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.progress p {
  margin: 0 0 var(--sp-2);
  font-size: var(--text-sm);
}
.progress p:last-child {
  margin: var(--sp-2) 0 0;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}
.progress progress {
  width: 100%;
  height: 6px;
  accent-color: var(--accent);
}

/* Notes Section */
.notes {
  margin-top: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
}
.notes h4 {
  margin: 0 0 var(--sp-1);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.notes div {
  font-size: var(--text-base);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 68ch;
}

/* Compact Transcript Utility & Filter Toolbar */
.util-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--border);
}
.util-bar.bottom {
  margin-top: 0;
  border-bottom: 0;
  border-top: 1px solid var(--border);
}

.speaker-filters {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-1);
}

.filter-pill {
  height: 24px;
  padding: 0 var(--sp-2);
  font-size: var(--text-xs);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-secondary);
}
.filter-pill[aria-pressed="true"] {
  background: var(--text);
  color: var(--panel);
  border-color: var(--text);
  font-weight: 600;
}

.util-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
}

button.icon {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 28px;
  padding: 0 var(--sp-2);
  font-size: var(--text-xs);
}

.copy-note {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
}

/* Swiss 3-Column Tabular Transcript */
.transcript {
  margin: 0;
  padding: 0;
  list-style: none;
  flex: 1;
}

.transcript li {
  display: grid;
  grid-template-columns: 60px 132px minmax(0, 1fr);
  gap: var(--sp-3);
  align-items: baseline;
  padding: var(--sp-2) var(--sp-2);
  border-bottom: 1px solid var(--border);
  transition: background-color 0.12s ease;
}

.transcript li.no-speaker {
  grid-template-columns: 60px minmax(0, 1fr);
}

.transcript li:hover {
  background: var(--bg);
}

.transcript li.playing {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  padding-left: calc(var(--sp-2) - 3px);
}

.transcript li[hidden] {
  display: none;
}

@media (max-width: 640px) {
  .transcript li,
  .transcript li.no-speaker {
    grid-template-columns: auto 1fr;
    gap: var(--sp-1) var(--sp-2);
  }
  .transcript li .seg-text {
    grid-column: 1 / -1;
  }
}

.ts {
  height: auto;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
}
.ts:hover:not(:disabled) {
  color: var(--accent);
  background: none;
  text-decoration: underline;
}

.spk {
  height: auto;
  padding: 1px var(--sp-2);
  font-size: var(--text-sm);
  font-weight: 600;
  background: none;
  border: 0;
  border-left: 3px solid currentColor;
  border-radius: 0;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.spk:hover:not(:disabled) {
  background: var(--hover);
}

.seg-text {
  font-size: var(--text-read);
  line-height: 1.65;
  color: var(--text);
  max-width: 68ch;
  overflow-wrap: anywhere;
}

/* Secondary Drawer: Re-transcribe & Manage Meeting */
details.secondary-drawer {
  margin-top: var(--sp-6);
  border-top: 1px solid var(--border);
  padding-top: var(--sp-3);
}

details.secondary-drawer > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  user-select: none;
}
details.secondary-drawer > summary::-webkit-details-marker { display: none; }
details.secondary-drawer > summary:hover { color: var(--text); }

.again {
  margin-top: var(--sp-3);
  padding: var(--sp-3);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.again h4 {
  margin: 0 0 var(--sp-2);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

/* Sticky Docked Audio Playback Bar (#tracks) */
.tracks {
  position: sticky;
  bottom: 0;
  z-index: 20;
  margin-top: auto;
  padding: var(--sp-2) var(--sp-4);
  background: var(--panel);
  border-top: 2px solid var(--border-strong);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
}

.track-player {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 1 1 240px;
}

.track-player label {
  margin: 0;
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-secondary);
  white-space: nowrap;
}

.tracks audio {
  width: 100%;
  height: 32px;
}

.output-popover {
  margin-left: auto;
}
.output-popover .popover-body {
  top: auto;
  bottom: calc(100% + var(--sp-1));
}

/* Sidebar Footer */
footer {
  margin-top: auto;
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: var(--text-xs);
  font-family: var(--font-mono);
}
footer button {
  height: 24px;
  font-size: var(--text-xs);
  padding: 0 var(--sp-2);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- Persistent Slim Recording & Capture Dock -->
  <header class="top-dock" aria-labelledby="rec-h">
    <h2 id="rec-h" class="sr-only">Recording</h2>
    <div class="dock-inner">
      <div class="brand-group">
        <h1>Meetings</h1>
        <p id="status" role="status" aria-live="polite">Not recording</p>
      </div>

      <div class="rec-controls">
        <label for="title" class="sr-only">Title</label>
        <input type="text" id="title" class="title-input" placeholder="Meeting title…" autocomplete="off">
        <button type="button" id="toggle" class="primary">Start recording</button>
        <div id="meters" hidden></div>
      </div>

      <div class="dock-drawers">
        <!-- Collapsible Capture & Speech Model Settings Drawer -->
        <details class="popover" id="settings-drawer">
          <summary id="settings-summary" title="Capture mode, language, and speech model">Settings</summary>
          <div class="popover-body">
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="mic">In person (mic)</option>
              <option value="mic+system">Online call (mic + system audio)</option>
            </select>
            <label for="language">Language</label>
            <select id="language">
              <option value="auto">Auto</option>
              <option value="th">ไทย</option>
              <option value="en">English</option>
            </select>
            <label for="model">Speech model</label>
            <select id="model"></select>
          </div>
        </details>

        <!-- Collapsible Audio Import Drawer -->
        <details class="popover" id="import-drawer">
          <summary title="Import an existing audio or video file">Import audio</summary>
          <div class="popover-body">
            <label for="import-file">Import audio file</label>
            <div class="row" style="margin-top:4px">
              <div><input type="file" id="import-file" accept="audio/*,video/*"></div>
              <button type="button" id="import" disabled>Import</button>
            </div>
            <p class="muted" style="margin:8px 0 0;font-size:var(--text-xs)">Uses the title, language and speech model selected. Without a title, the file name is used.</p>
            <div id="import-error" class="err" role="alert"></div>
          </div>
        </details>
      </div>
    </div>
    <div id="rec-error" class="err" role="alert"></div>
  </header>

  <main>
    <!-- Left Rail: Search, Meetings Index & Version -->
    <aside class="sidebar">
      <section class="sidebar-section" aria-labelledby="search-h">
        <h2 id="search-h">Search transcripts</h2>
        <form id="search-form" role="search">
          <label for="q" class="sr-only">Search</label>
          <div class="row">
            <div><input type="search" id="q" placeholder="Search words…"></div>
            <button type="submit">Search</button>
          </div>
        </form>
        <div id="hits"></div>
      </section>

      <section class="sidebar-list-section" aria-labelledby="list-h">
        <h2 id="list-h">Past meetings</h2>
        <ul class="list" id="meetings"></ul>
        <p class="muted" id="no-meetings" style="font-size:var(--text-xs);margin:var(--sp-2) 0 0" hidden>No meetings yet.</p>
      </section>

      <footer>
        <p id="version" aria-live="polite" style="margin:0"></p>
        <div id="update-error" class="err" role="alert"></div>
      </footer>
    </aside>

    <!-- Right Column: Maximized Transcript Reading Canvas -->
    <section aria-labelledby="view-h" id="view-section">
      <h2 id="view-h" class="sr-only">Meeting</h2>
      <div id="view"><p class="empty-state">Select a meeting to see its transcript.</p></div>
    </section>
  </main>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
